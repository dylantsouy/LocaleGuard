<!doctype html><html lang="{lang}"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Library catalogue</title>
<style>
*{box-sizing:border-box}body{font:16px/24px Arial,sans-serif;margin:12px}p,h2{margin:0}
#jump,#stranded{position:absolute;left:-1200px;top:0;background:white}#jump:focus-visible{left:0;z-index:5}
#switch{opacity:0;position:absolute;width:1px}label{display:inline-block;padding:4px}
#panel{position:fixed;left:-260px;top:30px;width:250px;height:260px;background:#ddd;overflow:auto;z-index:3}
#switch:checked~#panel{left:0}
#partial{position:relative;left:-54px;width:120px}#lost-heading{width:150px;transform:translateX(-240px)}
#titlebox{max-width:130px;overflow:hidden;white-space:nowrap}
.block{width:125px;height:32px;display:block}.cover{width:125px;height:32px;background:#275248;margin-top:-32px;position:relative}
.decor{position:relative;background:#cee;width:160px}.badge{position:absolute;right:0;top:0}.sticky{position:sticky;top:0}
.rail{display:flex;width:150px;overflow:auto}.rail span{flex:0 0 180px}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
footer{margin-top:100vh}footer nav{height:55px}footer p{line-height:24px}
@media(max-width:600px){footer nav{height:24px}}
</style><body>
<a id="jump" href="#main">{jump}</a><a id="stranded" href="#main">Index</a>
<div><input id="switch" type="checkbox" aria-expanded="false"><label for="switch">{menu}</label>
<div id="panel"><nav><a href="#main">Books</a></nav></div></div>
<main id="main"><div class="sticky">Catalogue</div><h2 id="lost-heading">Library index</h2>
<button id="partial">Reserve now</button><div id="titlebox">LongUnbreakableEditionName</div>
<button id="blocked" class="block" aria-label="Reserve"><i aria-hidden="true">+</i></button><div class="cover"></div>
<div class="decor"><button>Read <i aria-hidden="true">→</i></button><span class="badge">New</span></div>
<div class="rail" aria-roledescription="carousel"><span>First suggestion</span><span>Another suggestion</span></div>
<span class="sr">Reader instruction</span><p hidden>Hidden label</p></main>
<footer><nav><p>Information</p><p><a id="conditions" href="#main">{terms}</a></p></nav>
<section><p id="contact">{contact}</p></section></footer></body></html>
