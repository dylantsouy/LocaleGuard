name: CI
on:
  pull_request:
  push:
    branches: [main, develop, 'release/**']
    tags: ['v*-alpha.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm pack
          sha256sum localeguard-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-package
          path: |
            localeguard-*.tgz
            SHA256SUMS
          if-no-files-found: error
  test:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Enable Chromium's user namespace sandbox on the Ubuntu runner
        if: runner.os == 'Linux'
        run: |
          browsers=/opt/localeguard-playwright
          sudo cp -a "$HOME/.cache/ms-playwright" "$browsers"
          sudo chown -R root:root "$browsers"
          sudo chmod -R a+rX,go-w "$browsers"
          shell=$(find "$browsers" -type f \( -name chrome-headless-shell -o -name headless_shell \) -print -quit)
          test -x "$shell"
          sudo apparmor_parser -r <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile localeguard-chromium "$shell" flags=(unconfined) {
            userns,
          }
          PROFILE
          echo "PLAYWRIGHT_BROWSERS_PATH=$browsers" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Run source tests
        shell: bash
        run: |
          if npm test > source-tests.log 2>&1; then
            cat source-tests.log
          else
            cat source-tests.log
            node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const output = readFileSync('source-tests.log', 'utf8');
          const match = /No usable sandbox|Sandboxing failed|Operation not permitted|AssertionError|Error:|not ok /i.exec(output);
          const detail = output.slice(match?.index ?? -1800, match ? match.index + 2400 : undefined);
          console.log('::error::' + detail.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));
          JS
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: alpha-package
          path: release-assets
      - shell: bash
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          npm run test:package -- ./release-assets/localeguard-*.tgz
  publish-alpha:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: alpha-package
          path: release-assets
      - name: Publish tested tarball as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          cd release-assets
          sha256sum -c SHA256SUMS
          gh release create "$TAG" "localeguard-${TAG#v}.tgz" SHA256SUMS \
            --verify-tag --prerelease --title "LocaleGuard ${TAG#v}" \
            --notes-file "../docs/releases/$TAG.md"
