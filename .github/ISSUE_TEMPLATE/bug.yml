name: Bug report
description: Report a reproducible detection, installation or report-generation problem.
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: LocaleGuard version, OS and Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, languages, viewport and a minimal fixture or redacted config if possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the scan status, exit code or rule ID when relevant.
    validations:
      required: true
